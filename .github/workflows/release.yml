  #   needs: prepare
  #   runs-on: macos-latest
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       include:
  #         - arch: arm64
  #         - arch: amd64
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: actions/setup-go@v5
  #       with:
  #         go-version-file: go.mod
  #         cache: true
  #
  #     - name: Build
  #       env:
  #         CGO_ENABLED: '1'
  #         GOOS: darwin
  #         GOARCH: ${{ matrix.arch }}
  #       run: |
  #         mkdir -p dist
  #         go build -trimpath -ldflags "-s -w" -v -o "dist/hostagent-darwin-${{ matrix.arch }}" ./cmd/server
  #
  #     - name: Build pkg
  #       run: |
  #         chmod +x packaging/macos/build-pkg.sh
  #         ./packaging/macos/build-pkg.sh "${{ needs.prepare.outputs.version }}" "${{ matrix.arch }}"
  #
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: hostagent-macos-${{ matrix.arch }}
  #         path: BuildCache/*.pkg
  #         if-no-files-found: error

  # ==========================================================================
  # 创建 Release
  # ==========================================================================
  # ==========================================================================
  # opidcs CLI（Linux / macOS / Windows，amd64 + arm64）
  # ==========================================================================
  build-opidcs:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-22.04
            goos: linux
            goarch: arm64
          - runner: macos-latest
            goos: darwin
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build opidcs
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=""
          if [[ "${GOOS}" == "windows" ]]; then suffix=".exe"; fi
          go build -trimpath -ldflags "-s -w -X github.com/OpenIDCSTeam/HostAgent-Go/internal/cli/version.Version=${{ needs.prepare.outputs.version }}" \
            -o "dist/opidcs-${GOOS}-${GOARCH}${suffix}" ./cmd/opidcs
      - uses: actions/upload-artifact@v4
        with:
          name: opidcs-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/opidcs-*

  release:
    needs: [prepare, build-linux, build-windows, build-opidcs]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum opidcs-* > checksums.txt || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
            dist/opidcs-*
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # opidcs 桌面客户端（Tauri：Windows NSIS / Linux AppImage / macOS app+dmg）
  # ==========================================================================
  build-gui:
    needs: [prepare, release]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            triple: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            ext: .exe
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            ext: ""
            args: --bundles appimage
          - runner: macos-latest
            triple: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            ext: ""
            args: --target aarch64-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/opidcs-gui/package-lock.json

      - name: Install Linux dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install frontend dependencies
        working-directory: tools/opidcs-gui
        run: npm ci

      - name: Generate icons
        working-directory: tools/opidcs-gui
        run: npm run icon

      - name: Build opidcs sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/opidcs-gui/src-tauri/binaries
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X github.com/OpenIDCSTeam/HostAgent-Go/internal/cli/version.Version=${{ needs.prepare.outputs.version }}" \
            -o "tools/opidcs-gui/src-tauri/binaries/opidcs-${{ matrix.triple }}${{ matrix.ext }}" ./cmd/opidcs

      - name: Build desktop client and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tools/opidcs-gui
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}
